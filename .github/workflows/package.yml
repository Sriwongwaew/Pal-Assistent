# Builds the complete installer and test-runs it. Windows required.
#
# This file is the truth about how the package is built, and it is called from
# three places:
#
#   1. push to main when the packaging inputs changed (the paths below)
#   2. once a week, to catch drift from the outside — new versions of Node, Inno
#      Setup, PyInstaller or chocolatey can break the build without a single line
#      in the repo changing, and you do not want to find that out on the day you
#      mean to release
#   3. release.yml, via workflow_call, before publishing
#
# Living in its own file is the whole point: the smoke test below is eighty
# lines, and two copies of it would have drifted apart for certain.
#
# Why NOT on every push: most changes touch src/components and src/lib, and the
# Linux CI covers those completely in a third of the time. A Windows job that
# goes red from a network hiccup in choco on a CSS change only teaches you to
# ignore red. If you do want it on everything: drop the paths block.

name: Package

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Tag or commit to build. Empty = whatever triggered the run.
          The automatic release creates its tag first and points here, otherwise
          the package would have been built from the commit BEFORE the version
          bump — and the installer would carry the wrong version number.
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "tools/**"
      - "scripts/**"
      - "data/**"
      - "src/server/**"
      - "src/app/api/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  schedule:
    # Monday 05:00 UTC. Catches that the outside world has changed since last
    # time.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: the run may be the one a release is waiting for.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The installer is built with Inno Setup, the launcher is compiled with
    # csc.exe from .NET Framework, and palsave.exe is a Windows binary.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pyinstaller
          pip install -r tools/requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the code
        run: |
          npm run typecheck
          npm test
          npm run lint

      # FUNDING.yml gives the button on the repo's FRONT PAGE; the app's link
      # comes from the repository variable PA_DONATE. Two different places for
      # the same thing, and they drift apart quietly: FUNDING.yml is committed
      # and shows up in a diff, the variable only exists in Settings. That is
      # exactly how 2.2.0 shipped with "Support on Ko-fi" in the catalogue but no
      # address to point at.
      #
      # A warning, never a throw: a fork that wants no donation link at all is a
      # valid state, and asking for money in someone else's name is worse than
      # not asking at all.
      - name: Warn if the donation link was dropped
        shell: pwsh
        env:
          PA_DONATE: ${{ vars.PA_DONATE }}
        run: |
          $funding = '.github/FUNDING.yml'
          $declared = (Test-Path $funding) -and
            (Select-String -Path $funding -Pattern '^\s*ko_fi:\s*\S' -Quiet)
          if ($declared -and -not $env:PA_DONATE) {
            Write-Host ("::warning title=PA_DONATE is not set::FUNDING.yml declares a " +
              "Ko-fi recipient, but the repository variable PA_DONATE is empty. The app " +
              "is built without a donation link. Set it under Settings > Secrets and " +
              "variables > Actions > Variables.")
          } else {
            Write-Host "Donation link: $(if ($env:PA_DONATE) { 'set' } else { 'not declared' })"
          }

      - name: Build the package
        shell: pwsh
        env:
          # github.repository is "owner/name" — exactly what the update check
          # wants. It is also the on/off switch for the whole update feature.
          PA_REPO: ${{ github.repository }}
          PA_DONATE: ${{ vars.PA_DONATE }}
        run: |
          # The build log requires a login to read; annotations do not. Without
          # this, a failed package build is just "Process completed with exit
          # code 1" to anyone debugging from the outside — and build.ps1 throws
          # with clear messages that would then never arrive. It cost an evening
          # once.
          $ErrorActionPreference = 'Continue'
          npm run package *>&1 | Tee-Object -FilePath package.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Annotations are single-line: %0A is a line break, and % has to be
            # escaped first.
            $tail = (Get-Content package.log -Tail 30) -join "`n"
            $esc = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=Package build failed ($code)::$esc"
            exit $code
          }

      - name: Verify the package carries nobody's box
        shell: pwsh
        run: |
          # The last barrier against a developer's own save going out with the
          # build. The build always starts from data/pal-data.base.json, but the
          # file is 1.7 MB of JSON and a mistake in there does not show up in a
          # diff.
          $data = Get-Content 'packaging/build/payload/public/data/pal-data.json' -Raw | ConvertFrom-Json
          if ($data.pals.Count -ne 0 -or $data.player -ne '') {
            throw "The payload contains $($data.pals.Count) pals and the player '$($data.player)'."
          }
          # implants come from the save's item containers and are therefore just
          # as personal. Three outcomes, and they must not be conflated: the
          # field has to be there as an EMPTY object. If it is missing entirely,
          # the blanking in build.ps1 did not run, and then the barrier knows
          # nothing about what the next build carries.
          #
          # Never read $data.implants before the key has been checked:
          # @($null).Count is 1 in PowerShell, so a missing key used to be
          # reported as "carries 1 implant" — the right outcome (the build stops)
          # for the wrong reason, and it sends debugging the wrong way.
          $prop = $data.PSObject.Properties['implants']
          if (-not $prop -or $null -eq $prop.Value) {
            throw "The payload has no 'implants' - the blanking in build.ps1 did not run."
          }
          # The count only, never the ids: the build log is public, and the
          # passive ids are precisely the stash the barrier exists to keep in.
          $impl = @($prop.Value.PSObject.Properties).Count
          if ($impl -ne 0) { throw "The payload carries $impl implants from someone's stash." }
          # Progress (towers, effigies, quest log) is save-derived too. Unlike
          # implants the right blank is ABSENCE: undefined means "nothing read
          # yet" and makes the map/quests pages show their import hint.
          if ($data.PSObject.Properties['progress']) {
            throw "The payload carries someone's progression (towers/effigies/quests)."
          }
          # The Pal Soul wallet comes from the same containers as implants.
          if ($data.PSObject.Properties['souls']) {
            throw "The payload carries someone's Pal Soul wallet."
          }
          Write-Host "The box is empty - $($data.species.Count) species left."

      # The installer is started for real.
      #
      # This is the only step that tests the finished product rather than the
      # source, and the bugs it catches pass both typecheck and tests without
      # blinking: a missing `static/` gives an unstyled page, missing game icons
      # give empty boxes, and if palsave.exe is not found the server falls back
      # to Python — which the recipient does not have. All three have happened
      # during development.
      - name: Install and start the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process 'dist\PalCompanion-Setup.exe' `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\PalCompanion"

          foreach ($f in 'PalCompanion.exe','server.js','node\node.exe',
                         'tools\palsave\palsave.exe','public\data\pal-data.json') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "The installation is missing $f." }
          }
          if (-not (Test-Path (Join-Path $dir 'unins000.exe'))) { throw "No uninstaller." }

          # The server is started directly, without the launcher: the window
          # needs a screen and an Edge profile, and what we want to know is
          # whether the app works.
          $env:PORT = '3131'; $env:HOSTNAME = '127.0.0.1'; $env:NODE_ENV = 'production'
          $server = Start-Process (Join-Path $dir 'node\node.exe') -ArgumentList 'server.js' `
            -WorkingDirectory $dir -PassThru -WindowStyle Hidden
          $base = 'http://127.0.0.1:3131'

          try {
            $up = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try { if ((Invoke-WebRequest "$base/" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $up = $true; break } } catch {}
            }
            if (-not $up) { throw "The server never answered." }

            foreach ($p in '/','/box','/breeding','/best-for','/recommendations') {
              $r = Invoke-WebRequest "$base$p" -UseBasicParsing -TimeoutSec 30
              if ($r.StatusCode -ne 200) { throw "$p answered $($r.StatusCode)." }
            }

            # The styles are only served if .next-package/static was copied in.
            $html = (Invoke-WebRequest "$base/" -UseBasicParsing -TimeoutSec 30).Content
            $css = [regex]::Match($html, '/_next/static/css/[^"]+\.css').Value
            if (-not $css) { throw "The page references no CSS - static is missing from the package." }
            if ((Invoke-WebRequest "$base$css" -UseBasicParsing -TimeoutSec 30).StatusCode -ne 200) {
              throw "The CSS file could not be fetched: $css"
            }

            # The game icons live in public/ and are copied separately.
            if ((Invoke-WebRequest "$base/icons/alpha.webp" -UseBasicParsing -TimeoutSec 30).StatusCode -ne 200) {
              throw "The game icons are missing from the package."
            }

            $data = Invoke-RestMethod "$base/data/pal-data.json" -TimeoutSec 60
            if ($data.pals.Count -ne 0 -or $data.player -ne '') { throw "The package carries a box." }
            if ($data.species.Count -lt 100) { throw "The species list looks truncated ($($data.species.Count))." }

            # Decisive: the frozen reader has to answer. If the error mentions
            # Python it was not found, and then "Read from the game" works for
            # nobody.
            $scan = Invoke-RestMethod "$base/api/save/scan" -TimeoutSec 180
            if ($scan.error -and $scan.error -match 'Python') {
              throw "palsave.exe was not found - the server fell back to Python: $($scan.error)"
            }

            # PA_REPO must have been baked in, or nobody can update themselves.
            $upd = Invoke-RestMethod "$base/api/update/check" -TimeoutSec 60
            if (-not $upd.enabled) { throw "The update check is off - PA_REPO is missing from the build." }

            Write-Host "The installation starts, answers and reads saves. $($data.species.Count) species."
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      # The artifact is both what release.yml publishes and what you download
      # when you want to try a build without making a release of it.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: PalCompanion-Setup
          path: |
            dist/PalCompanion-Setup.exe
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
