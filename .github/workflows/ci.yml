# Checks every push and every pull request.
#
# The release workflow runs the same gate, but only once a tag is pushed — long
# after the mistake was written. This one runs straight away and takes about a
# minute and a half. The point is to never discover a broken build on the day
# you meant to ship something.
#
# Runs on Linux on purpose: the app itself is platform independent, and a Linux
# runner starts in seconds against Windows' good minute.
#
# The Windows-specific parts — the installer, the launcher, palsave.exe — live in
# package.yml, which runs when the packaging inputs change, once a week, and
# before every release. That split is deliberate: nearly every change touches
# src/components and src/lib, and this job covers those completely.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Push three times in a row and only the last one matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # First, and before npm ci: the check uses nothing but Node's own modules
      # and takes a couple of seconds. A broken image link in the README shows up
      # in no other step — and the README is all most people ever read of the
      # project.
      - name: Documentation images
        run: npm run docs-images

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # The probability maths. A miscalculated chance looks exactly as credible
      # as a real one, and neither the build, typecheck nor lint catches it —
      # that is why the tests exist and why they must never be skipped.
      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      # The build catches what typecheck misses: a client component that has
      # imported server code by accident, a page that crashes during prerender.
      - name: Build
        run: npm run build
