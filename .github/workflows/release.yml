# Publishes a GitHub release. Can start in three ways.
#
#   1. AUTOMATICALLY, Sunday evening. If there is anything under "## Unreleased"
#      in CHANGELOG.md the version is bumped, the tag is created and the release
#      is published. If there is nothing, nothing happens at all — a quiet week
#      is not a failure.
#   2. MANUALLY from the Actions tab, with an optional version step.
#   3. By a tag you pushed yourself (`npm version minor && git push --follow-tags`).
#
# So the cadence comes from the schedule, but the SAFETY does not. That comes
# from the gates in package.yml: typecheck, tests, lint, the whole package built,
# and the installer actually installed and started. If any of it fails, nothing
# is published. That is what makes it safe to release often without shipping
# something broken.
#
# Why the release does not simply push a tag and let the tag trigger do the work:
# GitHub deliberately starts no workflows from events created by GITHUB_TOKEN,
# precisely to avoid loops. A tag pushed from here therefore wakes nothing. So
# this file does the whole chain itself — and avoids the long-lived personal
# token that would otherwise be needed.

name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    # Sunday 17:00 UTC. The week's changes have had time to settle, and the
    # notice reaches users calmly rather than in the middle of a play session.
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      step:
        description: "Version step (empty = read the marker in CHANGELOG.md)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: read

# One release at a time, and never cancel one that has started publishing —
# halfway through a release is the worst place to be interrupted.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether there is anything to release, and creates the tag if so.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Decide whether to release
        id: decide
        env:
          SELECTED_STEP: ${{ inputs.step }}
        run: |
          set -euo pipefail

          # If we got here from a tag, the decision has already been made.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Triggered by tag $GITHUB_REF_NAME."
            echo "release=true"        >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          step="${SELECTED_STEP:-$(node scripts/changelog.mjs bump)}"
          if [[ "$step" == "none" ]]; then
            echo "Nothing under '## Unreleased' - no release this time."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing as $step."

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # npm version runs preversion (checks that notes exist) and version
          # (stamps CHANGELOG and adds it to the commit). Needs no installed
          # dependencies.
          npm version "$step"

          tag="v$(node -p "require('./package.json').version")"
          # Explicit pushes: --follow-tags only takes annotated tags, and npm
          # does not always create those.
          git push origin HEAD:main
          git push origin "$tag"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"

  # Builds the installer from the tag and test-installs it. Nothing that fails
  # this is ever published.
  package:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.release == 'true'
    # Publishing is file handling and one API call — no reason to pay for a
    # Windows runner for that.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # Must be the tag: CHANGELOG.md has to be the stamped version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: PalAssistent-Setup
          path: dist

      # The release text comes from CHANGELOG.md, never from the commit
      # subjects. The same text is shown in the app when it says an update is
      # available, so it is written for the person using the app.
      - name: Read the notes from CHANGELOG.md
        run: node scripts/changelog.mjs notes "${{ needs.prepare.outputs.tag }}" > release-notes.md

      - name: Verify the checksum
        run: |
          # The app's update feature refuses to install when the hash does not
          # match, so a wrong SHA256SUMS.txt makes the release unusable for
          # everyone already running the program — without anything showing up
          # in the build.
          cd dist && sha256sum --check SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/PalAssistent-Setup.exe
            dist/SHA256SUMS.txt
          body_path: release-notes.md
          draft: false
