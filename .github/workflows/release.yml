# Publicerar en GitHub-utgåva av det package.yml byggt och provkört.
#
# Körs när en tagg som `v2.1.0` pushas:
#
#     npm version minor        # uppdaterar package.json, stämplar CHANGELOG, taggar
#     git push --follow-tags
#
# Resultatet blir en utgåva med två filer, och båda namnen är stabila med flit:
#
#     PalAssistent-Setup.exe   installationsfilen
#     SHA256SUMS.txt           kontrollsumman som appen verifierar mot
#
# Den senaste versionen har därmed alltid samma adress, och det är den README
# länkar till:
#
#     https://github.com/<owner>/<repo>/releases/latest/download/PalAssistent-Setup.exe
#
# Själva bygget ligger i package.yml och körs likadant här som på en vanlig push –
# poängen med att anropa det i stället för att upprepa det är att en utgåva aldrig
# ska kunna byggas på ett annat sätt än det som testats hela veckan.

name: Utgåva

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# En utgåva i taget, och avbryt aldrig en som redan börjat publicera – halvvägs
# genom en release är det värsta stället att bli avbruten på.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bygger installern, provinstallerar den och laddar upp den som artefakt.
  paket:
    uses: ./.github/workflows/package.yml

  publicera:
    needs: paket
    # Publiceringen är bara filhantering och ett API-anrop – ingen anledning att
    # betala för en Windows-runner till det.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Behövs för CHANGELOG.md och scripts/changelog.mjs.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PalAssistent-Setup
          path: dist

      # Utgåvans text kommer ur CHANGELOG.md, inte ur commit-rubrikerna. Samma
      # text visas i appen när den säger att en uppdatering finns, så den är
      # skriven för den som använder appen. Saknas avsnittet stannar det här –
      # med flit: en utgåva utan noteringar är en utgåva ingen förstår.
      - name: Hämta noteringar ur CHANGELOG.md
        run: node scripts/changelog.mjs notes "${GITHUB_REF_NAME}" > release-notes.md

      - name: Kontrollera att kontrollsumman stämmer
        run: |
          # Appens uppdateringsfunktion vägrar installera när hashen inte matchar,
          # så en felaktig SHA256SUMS.txt gör utgåvan oanvändbar för alla som
          # redan kör programmet – utan att något syns här.
          cd dist && sha256sum --check SHA256SUMS.txt

      - name: Publicera utgåvan
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PalAssistent-Setup.exe
            dist/SHA256SUMS.txt
          body_path: release-notes.md
          draft: false
